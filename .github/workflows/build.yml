name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Testy a sestavení
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Připravit APK
        run: cp app/build/outputs/apk/release/app-release.apk Letadlo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Letadlo-apk
          path: Letadlo.apk

      - name: Zveřejnit jako release „latest"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Letadlo.apk \
            --target "$GITHUB_SHA" \
            --title "Letadlo – nejnovější build" \
            --notes "Automaticky sestaveno z commitu ${GITHUB_SHA::7}. Stáhni **Letadlo.apk** a nainstaluj do Androidu (8.0+)." \
            --latest
